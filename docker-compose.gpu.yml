# Optional overlay for an NVIDIA GPU. Without this file the same stack runs on CPU.
# Requires nvidia-container-toolkit on the host.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
