# Development stack: frontend + backend + Ollama.
# First start downloads the configured Ollama / Whisper / Piper models into volumes.

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      PIPER_MODEL_PATH: /models/piper/en_US-lessac-medium.onnx
      HF_HOME: /models/hf
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - piper_models:/models/piper
      - whisper_models:/models/hf
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  ollama_data:
  piper_models:
  whisper_models:
  frontend_node_modules:
